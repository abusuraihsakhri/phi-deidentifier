name: Deploy browser de-identifier

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static application
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          cp -R phi_deid _site/phi_deid
          find _site -type d -name __pycache__ -prune -exec rm -rf {} +
          test -s _site/index.html
          test -s _site/phi_deid/deidentifier.py
          test -s _site/phi_deid/data/names.csv
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
